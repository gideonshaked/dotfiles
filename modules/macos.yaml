# macOS desktop: zsh interactive setup, GUI apps, Homebrew.

- link:
    ~/.zshenv:
      path: terminal/zshenv
      force: true
    ~/.gitconfig: git/gitconfig

    ~/Library/Application Support/Code/User/settings.json: vscode/settings.json
    ~/Library/Application Support/Code/User/keybindings.json: vscode/keybindings.json

- shell:
    - description: Silencing the login banner
      command: touch ~/.hushlogin
      quiet: true

    - description: Installing shell tools (optional)
      command: scripts/install-shell-tools
      quiet: true
      stdout: true
      stderr: true
