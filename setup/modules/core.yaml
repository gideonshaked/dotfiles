# Core: every machine, every profile.
#
# Holds both the links and the install steps. The profile-specific settings
# module is listed BEFORE this one in every profile, because
# scripts/install-claude-plugins reads ~/.claude/settings.json and skips
# silently when it is absent.

- defaults:
    link:
      relink: true
      create: true

- clean: ["~", "~/.claude", "~/.ssh/config.d"]

- link:
    # One shell config, symlinked to both shells' rc files
    ~/.zshrc:
      path: terminal/shellrc
      force: true
    ~/.bashrc.dotfiles:
      path: terminal/shellrc
      force: true
    ~/.config/starship.toml: terminal/starship.toml

    # Git and SSH
    ~/.gitignore: git/gitignore
    ~/.gitconfig:
      path: git/gitconfig
      force: true
      backup: true
    ~/.ssh/config: ssh/config
    # Gitignored, so absent on a fresh clone until populated by hand.
    ~/.ssh/private.d:
      path: ssh/private.d
      ignore-missing: true
    ~/.ssh/config.d/01-github: ssh/config.d/01-github

    ~/bin:
      path: bin
      force: true
      backup: true

    # Claude Code, minus the profile-specific settings link
    ~/.claude/CLAUDE.md:
      path: agents/claude/CLAUDE.md
      force: true
    ~/.config/ccstatusline/settings.json:
      path: agents/claude/ccstatusline-settings.json
      force: true
    ~/.claude/skills:
      path: agents/claude/skills
      glob: false
      force: true
    ~/.claude/commands:
      path: agents/claude/commands
      glob: false
      force: true
    # settings.json names these by absolute path, so they need a stable home
    # that does not depend on where the repo is cloned.
    ~/.claude/hooks:
      path: agents/claude/hooks
      glob: false
      force: true
    ~/.claude/bin/dotfiles-npx: setup/scripts/dotfiles-npx

- shell:
    # ssh does not create the ControlPath directory, and multiplexing fails
    # without it. dotbot's create only applies mode when it makes the
    # directory, so an existing one keeps its own permissions.
    - description: Preparing the SSH control socket directory
      command: mkdir -p ~/.ssh/sockets && chmod 700 ~/.ssh/sockets
      quiet: true

    - description: Installing packages (optional)
      command: setup/scripts/install-packages
      quiet: true
      stdout: true
      stderr: true

    - description: Hooking into .bashrc and .bash_profile
      command: setup/scripts/configure-bash-hooks
      quiet: true
      stdout: true
      stderr: true

    - description: Configuring git
      command: setup/scripts/configure-git
      quiet: true
      stdout: true
      stderr: true

    - description: Installing npx with nvm if needed (optional)
      command: setup/scripts/ensure-npx
      quiet: true
      stdout: true
      stderr: true

    - description: Installing ccstatusline (optional)
      command: setup/scripts/install-ccstatusline
      quiet: true
      stdout: true
      stderr: true

    - description: Installing and updating Claude plugins (optional)
      command: setup/scripts/install-claude-plugins
      quiet: true
      stdout: true
      stderr: true

    - description: Installing agent MCPs (optional)
      command: setup/scripts/install-agent-mcps
      quiet: true
      stdout: true
      stderr: true
