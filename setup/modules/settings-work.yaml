# Work Claude settings: adds the Octant and Databricks plugins.
#
# Listed first in the profile so the link exists before core's install steps
# read it. A fresh machine has no ~/.claude yet, and core's link defaults do not
# reach this file, so the directory is created here first.

- create:
    - ~/.claude

- link:
    ~/.claude/settings.json:
      path: agents/claude/settings.work.json
      force: true
